[versions]
# 버전은 specs/001-foundation-migration/research.md R2 표 그대로다. 알파·베타는 쓰지 않는다.
agp = "9.3.3"
kotlin = "2.4.21"
ksp = "2.3.12"
composeMultiplatform = "1.12.2"
# CMP 1.12부터 material3가 따로 버전을 갖는다.
composeMaterial3 = "1.9.0"
jvmTarget = "17"

# 최신 androidx와 CMP 1.12가 컴파일 SDK 37을 요구한다.
# 타깃은 Play 요구(2026-08-31부터 36)에 맞춰 36으로 둔다. 37 동작 변경은 따로 확인한 뒤 올린다.
androidCompileSdk = "37"
androidTargetSdk = "36"
# 1.7.4와 같다(D4). 안드로이드 7.0 사용자도 업데이트를 받는다.
androidMinSdk = "24"

androidxActivityCompose = "1.13.0"
# Macrobenchmark와 Baseline Profile 플러그인이 같은 버전으로 나온다.
androidxBenchmark = "1.5.0"
androidxBiometric = "1.1.0"
# 앱 전체가 뒤로 가고 돌아오는 때(잠금 다시 잠그기). jbLifecycle과 같은 판을 쓴다.
androidxLifecycle = "2.11.0"
# MainActivity가 생체 인증 창을 띄우려면 FragmentActivity여야 한다.
androidxFragment = "1.8.9"
# 고를 때 받는 일기 글꼴 다섯 종(fonts/*)을 Play에서 받는다(research R17).
playFeatureDelivery = "2.1.0"
androidxCoreKtx = "1.19.0"
androidxCoreSplashscreen = "1.2.0"
androidxDatastore = "1.3.0"
androidxNavigation3 = "1.2.0"
androidxPaging = "3.5.3"
androidxProfileinstaller = "1.4.1"
# 3.1.0-alpha와 sqlite-bundled 2.8.0-alpha는 쓰지 않는다(R2).
androidxRoom3 = "3.0.3"
androidxSqlite = "2.7.1"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
desugarJdkLibs = "2.1.5"
androidxUiautomator = "2.4.0"
coil = "3.6.3"
compottie = "2.3.3"
filekit = "0.17.0"
jbAdaptive = "1.3.0"
jbLifecycle = "2.11.0"
jbNavigation3 = "1.2.0"
koin = "4.2.2"
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"
kotlinxSerialization = "1.11.0"
ktlint = "1.8.0"
# 파일 읽기·SHA-256. DataStore가 함께 가져오는 것과 같은 축이고 스펙 003 R19 표와 같은 버전이다.
okio = "3.18.2"
spotless = "8.10.4"
turbine = "1.2.1"

[libraries]
# CMP 1.12부터 compose.runtime 같은 줄임 접근자가 deprecated라 좌표를 직접 쓴다.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }
compose-ui-toolingPreview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
# 시스템 뒤로 가기(Android 뒤로, iOS 가장자리 밀기)를 공통 코드에서 받는다.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-material3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive", version.ref = "jbAdaptive" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCoreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxCoreSplashscreen" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "androidxDatastore" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "androidxPaging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "androidxPaging" }
# Play를 거치지 않고 깐 빌드(Macrobenchmark)에도 앱에 넣은 Baseline Profile을 깔아 준다.
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileinstaller" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "androidxRoom3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "androidxRoom3" }
androidx-room3-paging = { module = "androidx.room3:room3-paging", version.ref = "androidxRoom3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }

# Navigation 3. 런타임은 Google 것이 멀티플랫폼이고 NavDisplay는 JetBrains 것을 쓴다.
# 안드로이드에서는 Google navigation3-ui를 같이 걸어 같은 1.2.0으로 맞춘다.
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidxNavigation3" }
jb-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "jbNavigation3" }

# JetBrains가 멀티플랫폼으로 다시 낸 lifecycle. 공유 모듈에서는 이쪽을 쓴다.
jb-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jbLifecycle" }
jb-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jbLifecycle" }
jb-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jbLifecycle" }
jb-lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "jbLifecycle" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-test = { module = "io.insert-koin:koin-test" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 스펙 002·006이 쓴다. 버전은 R2 표에 함께 고정해 둔다.
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
compottie = { module = "io.github.alexzhirkevich:compottie", version.ref = "compottie" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }

turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# :benchmarks 모듈만 쓴다. 앱에 들어가지 않는다.
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
play-feature-delivery = { module = "com.google.android.play:feature-delivery", version.ref = "playFeatureDelivery" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiautomator" }

# convention plugin이 다른 플러그인의 설정 타입을 쓰려면 클래스패스에 올려야 한다.
agp-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradlePlugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
composeCompiler-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room3-gradlePlugin = { module = "androidx.room3:androidx.room3.gradle.plugin", version.ref = "androidxRoom3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBenchmark" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room3 = { id = "androidx.room3", version.ref = "androidxRoom3" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

# build-logic이 등록하는 플러그인. id는 build-logic/convention/build.gradle.kts에 있다.
diary-android-application = { id = "diary.android.application" }
diary-android-test = { id = "diary.android.test" }
diary-kmp-library = { id = "diary.kmp.library" }
diary-kmp-feature = { id = "diary.kmp.feature" }
diary-room = { id = "diary.room" }
diary-root = { id = "diary.root" }
