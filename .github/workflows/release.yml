# v* 태그에서 서명된 AAB와 iOS 아카이브를 만든다. 넣어야 할 비밀값은 docs/release.md "CD 비밀값"에 있다.
# 비밀값이 없으면 그 단계만 건너뛰고 변경 기록 초안은 남긴다. 스토어에 나가는 일은 Play 내부 트랙 업로드뿐이다.
name: Release

on:
  push:
    tags: ["v*"]
  # 태그 없이 손으로 돌리면 서명 확인만: 서명된 AAB를 만들고 검증한다. Play 업로드와 릴리스 초안은 하지 않는다.
  # 비밀값(키 비밀번호·별칭)이 맞는지 출시 전에 미리 본다.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 버전 확인과 변경 기록
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    outputs:
      android: ${{ steps.secrets.outputs.android }}
      ios: ${{ steps.secrets.outputs.ios }}
      play: ${{ steps.secrets.outputs.play }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: 태그와 앱 버전 맞추기
        if: github.event_name == 'push'
        run: sh scripts/release/check-version.sh "$GITHUB_REF_NAME"
      - name: 변경 기록 뽑기
        if: github.event_name == 'push'
        run: |
          sh scripts/release/changelog.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: changelog
          path: ${{ runner.temp }}/changelog.md
          if-no-files-found: error
          retention-days: 7
      - name: 비밀값이 있는지 보기
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          android=false; ios=false; play=false
          [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && android=true
          [ -n "$IOS_CERT" ] && [ -n "$IOS_CERT_PASSWORD" ] && [ -n "$IOS_PROFILE" ] && [ -n "$IOS_TEAM" ] && ios=true
          [ "$android" = true ] && [ -n "$PLAY_JSON" ] && play=true
          {
            echo "android=$android"
            echo "ios=$ios"
            echo "play=$play"
          } >> "$GITHUB_OUTPUT"
          [ "$android" = true ] || echo "::warning::Android 서명 비밀값이 없어 AAB를 건너뜁니다"
          [ "$ios" = true ] || echo "::warning::iOS 서명 비밀값이 없어 아카이브를 건너뜁니다"
          [ "$play" = true ] || echo "::warning::Play 비밀값이 없어 내부 트랙 업로드를 건너뜁니다"

  android:
    name: 서명된 AAB
    needs: prepare
    if: needs.prepare.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub 다운로드 서버가 잠깐 504를 내면 자바 받기가 실패해 CI 전체가 빨개졌다(2026-11-08).
      # 실패하면 30초 쉬고 한 번 더 받는다.
      - id: java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 17
      - if: steps.java.outcome == 'failure'
        run: sleep 30
      - if: steps.java.outcome == 'failure'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      # 출시 빌드는 남이 쓴 캐시를 믿지 않는다.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: 서명 키와 설정 파일 풀기
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_NATIVE: ${{ secrets.ADMOB_NATIVE }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          REVENUECAT_ANDROID: ${{ secrets.REVENUECAT_ANDROID }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "DIARY_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > composeApp/google-services.json
          else
            echo "::warning::google-services.json이 없어 사용 통계와 비정상 종료 보고가 꺼진 빌드입니다"
          fi
          # 광고나 구매가 빠진 앱이 스토어로 나가지 않게 여기서 멈춘다.
          for name in ADMOB_APP_ID ADMOB_NATIVE ADMOB_INTERSTITIAL ADMOB_REWARDED REVENUECAT_ANDROID; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "::error::$name 비밀값이 없습니다"
              exit 1
            fi
          done
          {
            echo "admob.app.id=$ADMOB_APP_ID"
            echo "admob.native=$ADMOB_NATIVE"
            echo "admob.interstitial=$ADMOB_INTERSTITIAL"
            echo "admob.rewarded=$ADMOB_REWARDED"
            echo "revenuecat.android=$REVENUECAT_ANDROID"
          } > local.properties
      # 키가 틀리면 10분 넘는 빌드 끝에야 알 수 있어 먼저 몇 초 만에 확인
      - name: 서명 키 먼저 확인
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          probe="$RUNNER_TEMP/probe"
          mkdir -p "$probe" && echo ok > "$probe/ok.txt"
          (cd "$probe" && jar cf probe.jar ok.txt)
          if ! keytool -list -keystore "$DIARY_KEYSTORE_PATH" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::키 파일 비밀번호(ANDROID_KEYSTORE_PASSWORD)나 별칭(ANDROID_KEY_ALIAS)이 맞지 않습니다"
            exit 1
          fi
          if ! jarsigner -keystore "$DIARY_KEYSTORE_PATH" -storepass:env STORE_PASSWORD -keypass:env KEY_PASSWORD \
              "$probe/probe.jar" "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::키 비밀번호(ANDROID_KEY_PASSWORD)가 맞지 않습니다"
            exit 1
          fi
          echo "서명 키 확인됨"
      - name: AAB 만들기
        env:
          DIARY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DIARY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DIARY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease
      - name: 서명 확인
        run: jarsigner -verify composeApp/build/outputs/bundle/release/composeApp-release.aab | grep "jar verified"
      # 공개 저장소의 산출물은 로그인한 누구나 받을 수 있다. 짧게 두고 난독화 매핑은 담지 않는다.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-aab
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Play 내부 트랙에 올리기
        if: needs.prepare.outputs.play == 'true' && github.event_name == 'push'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.sjhstudio.diary
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          # 프로덕션으로 가는 길을 여기 두지 않는다. 승격은 Play Console에서 사람이 한다.
          track: internal
          status: completed
          mappingFile: composeApp/build/outputs/mapping/release/mapping.txt

  ios:
    name: iOS 아카이브
    needs: prepare
    if: needs.prepare.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub 다운로드 서버가 잠깐 504를 내면 자바 받기가 실패해 CI 전체가 빨개졌다(2026-11-08).
      # 실패하면 30초 쉬고 한 번 더 받는다.
      - id: java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        continue-on-error: true
        with:
          distribution: temurin
          java-version: 17
      - if: steps.java.outcome == 'failure'
        run: sleep 30
      - if: steps.java.outcome == 'failure'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      # 러너 메모리가 7GB다. 저장소 설정보다 이 파일이 앞선다.
      - name: Gradle 힙을 러너에 맞추기
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
      - name: 인증서와 프로필, 설정 파일 풀기
        env:
          IOS_CERT: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          GOOGLE_SERVICE_INFO: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          LOCAL_XCCONFIG: ${{ secrets.IOS_LOCAL_XCCONFIG_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$IOS_CERT" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/release.p12" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/release.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/release.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/release.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICE_INFO" ]; then
            echo "$GOOGLE_SERVICE_INFO" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          else
            echo "::warning::GoogleService-Info.plist가 없어 사용 통계와 비정상 종료 보고가 꺼진 빌드입니다"
          fi
          if [ -n "$LOCAL_XCCONFIG" ]; then
            echo "$LOCAL_XCCONFIG" | base64 --decode > iosApp/iosApp/Local.xcconfig
          else
            echo "::warning::Local.xcconfig가 없어 구글 드라이브 연결이 안 되는 빌드입니다"
          fi
      - name: 아카이브 만들기
        env:
          IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" archive
      - name: IPA 내보내기
        env:
          IOS_TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          plist="$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' \
            -c 'Add :signingStyle string manual' \
            -c "Add :teamID string $IOS_TEAM" \
            -c 'Add :provisioningProfiles dict' \
            -c "Add :provisioningProfiles:org.sjhstudio.diary string $IOS_PROFILE_NAME" "$plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iosApp.xcarchive" \
            -exportOptionsPlist "$plist" -exportPath "$RUNNER_TEMP/export"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 3
      - name: 키체인 지우기
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true

  # 비밀값 없이도 변경 기록 초안은 남는다. 공개는 Releases 화면에서 사람이 한다.
  draft:
    name: GitHub Release 초안
    needs: [prepare, android, ios]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.prepare.result == 'success' && needs.android.result != 'failure' && needs.ios.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
      - name: 초안 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file changelog.md
