# 푸시마다 검사·시험·빌드를 돌린다(research R20).
# 공개 저장소라 GitHub 표준 러너는 무료다.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 검사·시험·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 커밋 형식 검사 시험
        run: sh scripts/test-commit-msg.sh
      - name: 검사·시험·빌드
        run: ./gradlew spotlessCheck designTokenCheck stringResourceCheck allTests assembleDebug

  ios:
    name: iOS 시험과 Xcode 빌드
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 공유 모듈 시험(iOS 시뮬레이터)
        run: ./gradlew iosSimulatorArm64Test
      - name: Xcode 빌드
        run: >
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  # 1.7.4에서 올리는 업그레이드 계측 시험. 오래 걸려서 손으로만 돌린다(Actions 탭의 Run workflow).
  upgrade:
    name: 업그레이드 시험(API ${{ matrix.api }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [24, 29, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: 에뮬레이터 가속(KVM) 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: ./gradlew :composeApp:connectedDebugAndroidTest
