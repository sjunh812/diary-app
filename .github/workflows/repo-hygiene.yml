# 공개 저장소에 비밀값과 큰 파일이 들어가지 않게 본다. 문서만 바꾼 커밋도 본다.
name: 저장소 위생

on:
  push:
    branches: [master, feat/foundation-migration]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # 지금 저장소에서 가장 큰 글꼴이 12.3MB다. 이보다 큰 파일은 저장소에 넣기 전에 다시 생각한다.
  MAX_FILE_KB: 15360

jobs:
  hygiene:
    name: 비밀값과 큰 파일 검사
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 받기
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: 이번 변경에서 비밀값 찾기
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000) range="$HEAD_SHA" ;;
            *) range="$BASE_SHA..$HEAD_SHA" ;;
          esac
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml --log-opts="$range" .
      - name: 큰 파일 찾기
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh scripts/check-large-files.sh "$BASE_SHA" "$HEAD_SHA" "$MAX_FILE_KB"
