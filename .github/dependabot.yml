# 판 올리기 PR을 묶어서 한 달에 한 번 받는다.
# 설정은 기본 브랜치(develop)에 있어야 켜진다.
# 앱에 쓰는 버전은 알파·베타로 올리지 않는다(specs/001-foundation-migration research R2). 그런 PR은 닫는다.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    # 편집기 라이브러리는 쓰기 화면이 내부 함수에 기대고(DiaryRichEditor.kt, EditorInput.kt) 선택 핸들 동작을 손봐서,
    # 판을 올리면 소리 없이 동작이 바뀔 수 있다. 자동으로 올리지 않고 원본과 견주며 손으로 올린다(2026-11-10).
    ignore:
      - dependency-name: "com.mohamedrejeb.richeditor*"
    groups:
      # 같이 움직여야 빌드가 되는 것끼리 묶는다.
      kotlin-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
      android-build:
        patterns:
          - "com.android*"
          - "androidx.baselineprofile*"
          - "androidx.benchmark*"
      androidx:
        patterns:
          - "androidx.*"
      firebase-play:
        patterns:
          - "com.google.firebase*"
          - "com.google.gms*"
          - "com.google.android.gms*"
          - "com.google.android.play*"
      lint-tools:
        patterns:
          - "dev.detekt*"
          - "io.nlopez.compose.rules*"
          - "com.diffplug.spotless*"
          - "com.pinterest.ktlint*"
      others:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
