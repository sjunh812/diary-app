      d: Fil, cartes ou grille de photos, à vous de choisir.
    - t: Mise en forme
      d: Faites ressortir l’essentiel avec la couleur du texte et le surligneur.
  trust_title: Votre journal n’est qu’à vous
  trust1_title: Même le développeur ne peut pas le lire
  trust1_body: Aucun serveur ne collecte vos entrées. Vos entrées et photos restent sur cet appareil et dans votre Google Drive.
  trust2_title: Sans inscription
  trust2_body: Installez et commencez à écrire. Vous ne connectez un compte Google que pour la sauvegarde.
  trust3_title: Verrouillez-le
  trust3_body: Activez un code ou la biométrie pour être seul à pouvoir l’ouvrir.
  plans_title: Gratuit et Plus
  free_name: Gratuit
  free_sub: Ce qui est gratuit aujourd’hui le restera.
  free_items:
    - Écrire avec jusqu’à 10 photos par entrée
    - Sauvegarde des photos sur Google Drive
    - 15 humeurs et 5 thèmes gratuits
    - 7 couleurs de thème et 10 polices
    - Verrouillage, calendrier, recherche et bilan
  plus_sub: Sans pub, avec plus de façons de le personnaliser.
  plus_items: [Sans pub, 30 photos, Statistiques avancées, Couleur du thème personnalisée, Thèmes d’humeur, Listes à cocher, Garder la mise en forme]
  plans_note: Vous voulez seulement retirer la pub ? Un achat unique « Supprimer la pub » existe aussi. Les prix sont indiqués dans l’app.
  faq_title: Questions fréquentes
  faq:
    - q: Est-ce gratuit ?
      a: Oui. Écrire et sauvegarder vos photos est gratuit. Pour l’utiliser sans pub, choisissez Supprimer la pub (achat unique) ou Plus (abonnement annuel).
    - q: Les thèmes d’humeur sont-ils gratuits ?
      a: Classique, Formes, Gouache, Contour et Pixel sont gratuits. Bulles, Gribouillis, Fruits et légumes et Visages en pâte sont inclus dans Plus.
    - q: Que deviennent mes entrées si je change de téléphone ?
      a: Restaurez-les sur le nouveau téléphone avec le même compte Google, même entre iPhone et Android.
    - q: Dans quelles langues est disponible l’app ?
      a: En français, anglais, coréen, japonais, chinois traditionnel, espagnol, portugais et allemand. L’app suit la langue de votre téléphone.
    - q: Envoyez-vous mes entrées quelque part ?
      a: Non. Vos entrées et photos restent sur cet appareil et dans le Google Drive que vous connectez. Elles ne servent jamais à la pub ni aux statistiques.
