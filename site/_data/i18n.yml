  backup_title: 사진까지<br>내 드라이브에 둬요
  backup_body: 일기와 사진을 내 구글 드라이브에 올려둬요. 휴대폰을 바꿔도 그대로 복원해요.
  alt_backup: 사진까지 드라이브에 백업하는 화면
  tablet_label: 태블릿
  tablet_title: 넓은 화면에서는<br>두 칸으로 봐요
  tablet_body: 목록과 일기를 나란히 띄워요. iPad, 안드로이드 태블릿, 폴더블에서도 편하게 써요.
  alt_tablet: 태블릿에서 목록과 일기를 나란히 보는 화면
  trust_title: 안심하고 써요
  trust1_title: 기기와 내 드라이브에만
  trust1_body: 일기와 사진은 이 기기와 내 구글 드라이브에만 저장돼요.
  trust2_title: 개발자도 볼 수 없어요
  trust2_body: 회원가입이 없고, 일기를 모아두는 서버도 없어요.
  trust3_title: 잠금으로 지켜요
  trust3_body: 비밀번호와 생체인증으로 일기를 잠글 수 있어요.
  faq_title: 자주 묻는 질문
  faq:
    - q: 무료인가요?
      a: 네, 일기 쓰기와 사진까지 담는 백업은 모두 무료예요. 광고 없이 쓰고 싶으면 광고 제거나 Plus를 고를 수 있어요.
    - q: 휴대폰을 바꾸면 일기는 어떻게 되나요?
      a: 새 휴대폰에서 같은 구글 계정으로 복원하면 돼요. 아이폰과 안드로이드 사이에서도 옮길 수 있어요.
    - q: 예전 버전에서 쓴 일기도 남아 있나요?
      a: 네, 안드로이드에서 쓰던 일기는 업데이트하면 사진까지 그대로 옮겨져요. 아이폰 앱은 이번에 처음 나와서 예전 버전이 없어요.
    - q: 일기 내용을 다른 곳에 보내나요?
      a: 아니요. 일기 내용과 사진은 내가 고른 저장소에만 둬요. 광고나 사용 통계에도 쓰지 않아요.
