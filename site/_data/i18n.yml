  insight_label: ふりかえり
  insight_title: どんな気分が多かったか<br>ひと目でわかる
  insight_body: 週・月・年ごとに気分をまとめて表示します。過去の日記はカレンダーと検索ですぐ見つかります。
  alt_insight: 気分の流れをふりかえる画面
