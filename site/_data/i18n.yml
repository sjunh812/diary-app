ko:
  html: ko
  locale: ko_KR
  name: 1일 1일기
  home: /1day1diary/
  screens: /assets/screens/
  description: 바쁜 사람을 위한 간편한 일기장, 1일 1일기
  og: 한 줄이면 오늘 일기 끝. 짧게 써도 매일 쌓이면 나만의 기록이 돼요.
  get: 앱 다운로드
  privacy: 개인정보처리방침
  terms: 이용약관
  contact: 문의하기
  copied: 주소를 복사했어요
  mail: "메일 주소:"
  language: 언어
  hero: <em class="hl">한 줄</em>이면<br>오늘 일기 끝
  lead: 짧게 써도 매일 쌓이면 나만의 기록이 돼요.
  alt_list: 지난 일기 목록 화면
  features: 주요 기능
  write_label: 쓰기
  write_title: 사진과 기분도<br>같이 남겨요
  write_body: 사진, 날씨, 장소를 함께 담아요. 아홉 가지 기분으로 그날을 표시할 수도 있어요.
  alt_write: 기분을 고르고 일기를 쓰는 화면
  insight_label: 돌아보기
  insight_title: 어떤 기분이 많았는지<br>한눈에 봐요
  insight_body: 주, 월, 년 단위로 기분을 모아 보여줘요. 지난 일기는 달력과 검색으로 금방 찾을 수 있어요.
  alt_insight: 기분 흐름을 돌아보는 화면
  backup_label: 백업
  backup_title: 휴대폰을 바꿔도<br>일기는 그대로예요
  backup_body: 일기와 사진을 내 구글 드라이브에 백업할 수 있어요. 새 휴대폰에서 같은 계정으로 복원하면 돼요.
  alt_backup: 사진까지 드라이브에 백업하는 화면
  tablet_label: 태블릿
  tablet_title: 넓은 화면에서는<br>목록과 일기를 나란히
  tablet_body: iPad, 안드로이드 태블릿, 폴더블에서도 화면에 맞게 보여요.
  alt_tablet: 태블릿에서 목록과 일기를 나란히 보는 화면
  more_title: 이런 것도 돼요
  more:
    - t: 자동 임시 저장
      d: 쓰다가 앱을 닫아도 쓰던 글이 남아 있어요.
    - t: 휴지통 30일
      d: 실수로 삭제한 일기도 30일 안에는 복원할 수 있어요.
    - t: 글꼴 10종
      d: 손 글씨부터 바탕체까지 마음에 드는 글꼴로 써요.
    - t: 목록 모양 세 가지
      d: 피드, 카드, 사진 격자 중에서 골라봐요.
    - t: 글 서식
      d: 굵게, 글자 색, 형광펜, 목록으로 글을 정리해요.
    - t: 다크 모드
      d: 밤에도 눈부시지 않게 어두운 화면으로 써요.
  trust_title: 내 일기는 나만 봐요
  trust1_title: 개발자도 볼 수 없어요
  trust1_body: 일기를 모아두는 서버가 없어요. 일기와 사진은 이 기기와 내 구글 드라이브에만 있어요.
  trust2_title: 회원가입이 없어요
  trust2_body: 설치하고 바로 쓰면 돼요. 백업할 때만 구글 계정을 연결해요.
  trust3_title: 잠금을 걸 수 있어요
  trust3_body: 비밀번호나 생체인증을 켜두면 나만 열 수 있어요.
  faq_title: 자주 묻는 질문
  faq:
    - q: 무료인가요?
      a: 네. 일기 쓰기와 사진 백업은 모두 무료예요. 광고 없이 쓰고 싶다면 광고 제거(1회 구매)나 Plus(연 구독)를 고르면 돼요.
    - q: 휴대폰을 바꾸면 일기는 어떻게 되나요?
      a: 새 휴대폰에서 같은 구글 계정으로 복원하면 돼요. 아이폰과 안드로이드 사이에서도 옮길 수 있어요.
    - q: 예전 버전에서 쓴 일기도 남아 있나요?
      a: 네. 안드로이드에서 쓰던 일기는 앱을 업데이트하면 사진까지 그대로 옮겨져요. 아이폰 앱은 이번에 처음 나와서 예전 버전이 없어요.
    - q: 일기 내용을 다른 곳에 보내나요?
      a: 아니요. 일기와 사진은 이 기기와 내가 연결한 구글 드라이브에만 있어요. 광고나 사용 통계에도 쓰지 않아요.
  cta_title: 오늘부터 <em class="hl">1일 1일기</em><br>시작해 보세요
  cta_body: iPhone, iPad, Android에서 무료로 쓸 수 있어요.
  badge_apple: App Store에서 다운로드
  badge_google: Google Play에서 다운로드
  apple_width: 130

en:
  html: en
  locale: en_US
  name: 1 Day 1 Diary
  home: /en/1day1diary/
  screens: /assets/screens/en/
  description: A simple diary for busy people. One line, and today's entry is done.
  og: Today's entry, in one line. Short entries add up to a record of your own.
  get: Download
  privacy: Privacy Policy (Korean)
  terms: Terms (Korean)
  contact: Contact
  copied: copied
  mail: "Email:"
  language: Language
  hero: Today's entry,<br>in <em class="hl">one line</em>
  lead: Short entries add up to a record of your own.
  alt_list: List of past entries
  features: Key features
  write_label: Write
  write_title: Add photos<br>and your mood
  write_body: Add photos, the weather, and where you were. You can also mark the day with one of nine moods.
  alt_write: Picking a mood while writing an entry
  insight_label: Look back
  insight_title: See which moods<br>came up most
  insight_body: Your moods are grouped by week, month, and year. Find past entries quickly with the calendar and search.
  alt_insight: Looking back on your moods
  backup_label: Backup
  backup_title: New phone,<br>same diary
  backup_body: Back up your entries and photos to your own Google Drive. On a new phone, restore them with the same account.
  alt_backup: Backing up to Google Drive
  tablet_label: Tablet
  tablet_title: On big screens,<br>list and entry side by side
  tablet_body: Fits the screen on iPad, Android tablets, and foldables.
  alt_tablet: List and entry side by side on a tablet
  more_title: And a few more things
  more:
    - t: Auto-saved drafts
      d: Close the app mid-sentence and your draft is still there.
    - t: 30-day Trash
      d: Deleted an entry by mistake? Restore it within 30 days.
    - t: 10 fonts
      d: Write in a font you like, from handwriting to serif.
    - t: Three list styles
      d: Choose a feed, cards, or a photo grid.
    - t: Formatting
      d: Organize your writing with bold, text color, highlights, and lists.
    - t: Dark mode
      d: Easy on the eyes at night.
  trust_title: Your diary is yours alone
  trust1_title: Not even the developer can see it
  trust1_body: There's no server that collects entries. Your entries and photos stay on this device and in your Google Drive.
  trust2_title: No sign-up
  trust2_body: Install it and start writing. You only connect a Google account to back up.
  trust3_title: Lock it
  trust3_body: Turn on a passcode or biometrics so only you can open it.
  faq_title: FAQ
  faq:
    - q: Is it free?
      a: Yes. Writing and photo backups are free. To use it without ads, choose Remove Ads (one-time purchase) or Plus (yearly subscription).
    - q: What happens to my entries when I switch phones?
      a: Restore them on your new phone with the same Google account. You can move between iPhone and Android too.
    - q: Do you send my entries anywhere?
      a: No. Your entries and photos stay on this device and in the Google Drive you connect. They're never used for ads or usage stats.
  cta_title: Start your <em class="hl">1 Day 1 Diary</em><br>today
  cta_body: Free on iPhone, iPad, and Android.
  badge_apple: Download on the App Store
  badge_google: Get it on Google Play
  apple_width: 120

ja:
