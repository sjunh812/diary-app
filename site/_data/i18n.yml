  backup_body: 日記と写真を自分のGoogleドライブにバックアップできます。新しいスマホで同じアカウントから復元するだけです。
  alt_backup: Googleドライブにバックアップする画面
  tablet_label: タブレット
  tablet_title: 大きな画面では<br>一覧と日記を並べて
  tablet_body: iPad、Androidタブレット、折りたたみスマホでも画面に合わせて表示します。
