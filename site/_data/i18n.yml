      d: 太字、文字色、マーカー、リストで文章を整えられます。
    - t: ダークモード
      d: 夜でもまぶしくない暗い画面で使えます。
  trust_title: 日記は自分だけのもの
  trust1_title: 開発者も見られません
  trust1_body: 日記を集めるサーバーはありません。日記と写真は、この端末と自分のGoogleドライブにだけ保存されます。
  trust2_title: 会員登録は不要
  trust2_body: インストールしてすぐ使えます。Googleアカウントをつなぐのはバックアップのときだけです。
  trust3_title: ロックをかけられます
  trust3_body: パスコードや生体認証をオンにすれば、自分だけが開けます。
  faq_title: よくある質問
  faq:
    - q: 無料ですか？
      a: はい。日記を書くことも、写真のバックアップも無料です。広告なしで使いたい場合は、広告削除（買い切り）かPlus（年額）を選べます。
    - q: 機種変更したら日記はどうなりますか？
      a: 新しいスマホで同じGoogleアカウントから復元できます。iPhoneとAndroidの間でも移せます。
    - q: 日記の内容をどこかに送っていますか？
      a: いいえ。日記と写真は、この端末とつないだGoogleドライブにだけ置かれます。広告や利用統計にも使いません。
  cta_title: 今日から<em class="hl">1日1日記</em><br>始めてみませんか
  cta_body: iPhone・iPad・Androidで無料で使えます。
  badge_apple: App Storeからダウンロード
  badge_google: Google Play で手に入れよう
  apple_width: 109
