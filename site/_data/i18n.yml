en:
  html: en
  locale: en_US
  name: 1 Day 1 Diary
  home: /en/1day1diary/
  screens: /assets/screens/en/
  description: A simple diary for busy people. Pick a mood, jot a few lines, done.
  og: One line a day is enough. Pick a mood, jot a few lines, and today's entry is done.
  get: Download
  privacy: Privacy Policy (Korean)
  terms: Terms (Korean)
  contact: Contact
  copied: copied
  mail: "Email:"
  language: Language
  hero: One <em class="hl">line</em> a day<br>is enough
  lead: Pick a mood, jot a few lines, and today's entry is done.
  alt_list: List of past entries
  features: Key features
  write_label: Write
  write_title: Pick a mood<br>and start
  write_body: Choose one of nine moods and leave a few lines. Add weather, place, and photos too.
  alt_write: Picking a mood while writing an entry
  insight_label: Look back
  insight_title: See your moods<br>at a glance
  insight_body: See which moods came up most each week, month, and year. Find past entries fast with the calendar and search.
  alt_insight: Looking back on your moods
  backup_label: Backup
  backup_title: Photos included,<br>in your own Drive
  backup_body: Back up entries and photos to your own Google Drive. Switch phones and restore everything as it was.
  alt_backup: Backing up to Google Drive
  tablet_label: Tablet
  tablet_title: Two panes<br>on big screens
  tablet_body: See your list and entry side by side. Works great on iPad, Android tablets, and foldables.
  alt_tablet: List and entry side by side on a tablet
  trust_title: Private by design
  trust1_title: Only on your device and Drive
  trust1_body: Entries and photos are stored only on this device and in your Google Drive.
  trust2_title: Not even the developer can see them
  trust2_body: No sign-up, and no server that collects your entries.
  trust3_title: Lock it
  trust3_body: Lock your diary with a passcode or biometrics.
  faq_title: FAQ
  faq:
    - q: Is it free?
      a: Yes. Writing and backups with photos are all free. To use it without ads, choose Remove Ads or Plus.
    - q: What happens to my entries when I switch phones?
      a: Restore them on your new phone with the same Google account. You can move between iPhone and Android too.
    - q: Do you send my entries anywhere?
      a: No. Your entries and photos stay only in the storage you choose. They're never used for ads or usage stats.
  cta_title: Start your <em class="hl">1 Day 1 Diary</em><br>today
  cta_body: Available on iPhone, iPad, and Android.
  badge_apple: Download on the App Store
  badge_google: Get it on Google Play
  apple_width: 120

