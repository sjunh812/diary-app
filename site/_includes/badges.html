  <a href="https://apps.apple.com/app/id6835116731" aria-label="{{ t.badge_apple }}"><img class="badge-apple" src="/assets/badges/app-store-{{ page.lang | default: 'ko' }}.svg" alt="{{ t.badge_apple }}" width="{{ t.apple_width }}" height="40"></a>
